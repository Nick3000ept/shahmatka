name: Daily Tech Digest

on:
  schedule:
    - cron: '0 6 * * *'  # 09:00 Moscow (UTC+3)
  workflow_dispatch:      # можно запустить вручную

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shahmatka
        uses: actions/checkout@v4

      - name: Checkout supply-form
        uses: actions/checkout@v4
        with:
          repository: Nick3000ept/supply-form
          path: supply-form

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Generate and send digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "325113969"
        run: python .github/digest.py
